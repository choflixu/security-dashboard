# Server
server.port=${PORT:8080}

# CORS - permite el frontend en Vercel
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Directorio donde viven los scripts Bash
app.scripts.directory=${SCRIPTS_DIR:/opt/security-scripts}

# Timeout de ejecucion de scripts en segundos
app.scripts.timeout=${SCRIPTS_TIMEOUT:60}

# Logging
logging.level.com.security=DEBUG
